# Render Blueprint: hosts the Express API (Option B).
# Connect this repo in Render → New → Blueprint → apply this file.
# You must set DATABASE_URL in the Render dashboard (Neon connection string).

services:
  - type: web
    name: doctor-hospital-hub-api
    runtime: node
    plan: free
    region: oregon
    # Avoid `corepack enable` — Render's filesystem is read-only at /usr/bin.
    # NODE_ENV=production (below) skips devDependencies; esbuild is required to build.
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      NODE_ENV=development pnpm install --frozen-lockfile --filter @workspace/api-server... &&
      NODE_ENV=development pnpm --filter @workspace/api-server run build &&
      node lib/db/scripts/migrate-appraisals.mjs &&
      node lib/db/scripts/migrate-training-appraisals.mjs &&
      node lib/db/scripts/migrate-employee-incidents.mjs &&
      node lib/db/scripts/migrate-onboardings.mjs &&
      node lib/db/scripts/ensure-jobs-staff-needed.mjs &&
      node lib/db/scripts/migrate-employee-accounts.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
